apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ignore-replicas-example
  namespace: openshift-gitops
spec:
  project: expert-labs
  source:
    repoURL: https://github.com/zdmooc/argocd-expert-pack.git
    targetRevision: main
    path: labs/lab02-first-app/manifests/guestbook
  destination:
    server: https://kubernetes.default.svc
    namespace: lab-ignore-diff
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: guestbook
      jsonPointers:
        - /spec/replicas
