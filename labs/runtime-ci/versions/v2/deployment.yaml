apiVersion: apps/v1
kind: Deployment
metadata:
  name: runtime-demo
  labels:
    app.kubernetes.io/name: runtime-demo
    app.kubernetes.io/version: v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: runtime-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: runtime-demo
        app.kubernetes.io/version: v2
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_VERSION
              value: v2
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
